name: Android CI/CD - Build & Release APK

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangapill-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: mangapill-app-debug
          path: ./release-apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-apk/app-debug.apk
          name: Mangapill App Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Mangapill Native Android App Release
            
            ### Downloadable APK
            - [Download Mangapill APK](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug.apk)
            
            ### Features
            - Native Jetpack Compose UI with "Liquid Glass" design language
            - Phone and Tablet adaptive navigation (BottomBar / NavigationRail)
            - OkHttp + JSoup Scraping Engine
            - Room Database offline caching and reading progress synchronization
            - Webtoon vertical continuous scroll & Horizontal manga page-flip modes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
