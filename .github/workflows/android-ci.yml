name: Android CI/CD - Build & Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# One run at a time per branch so release version numbers never collide.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # ---- Pull requests: just prove it compiles ------------------------------------------------
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK (PR check)
        if: env.IS_RELEASE != 'true'
        run: ./gradlew assembleDebug --stacktrace

      # ---- Merges to main: signed, versioned release --------------------------------------------
      - name: Compute next version (v1.0.x)
        if: env.IS_RELEASE == 'true'
        id: version
        run: |
          git fetch --tags --force
          LAST=$(git tag -l 'v1.0.*' | sed 's/^v1\.0\.//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          NEXT=$(( ${LAST:--1} + 1 ))
          echo "name=1.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$NEXT" >> "$GITHUB_OUTPUT"
          # Must strictly increase for Android to accept the APK as an update.
          echo "code=$(( 10000 + NEXT ))" >> "$GITHUB_OUTPUT"

      # The release key lives in repository secrets (KEYSTORE_BASE64 = base64 of the keystore,
      # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD), never in the repository. Every release must be
      # signed with it, or Android refuses to install the APK over the previous version.
      - name: Restore signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set: the release cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}
          rm -f "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Name APK
        if: env.IS_RELEASE == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "Mangapill-${{ steps.version.outputs.tag }}.apk"

      - name: Upload APK artifact
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mangapill-${{ steps.version.outputs.tag }}
          path: Mangapill-${{ steps.version.outputs.tag }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mangapill ${{ steps.version.outputs.tag }}
          files: Mangapill-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
          make_latest: true
          body: |
            ## Mangapill ${{ steps.version.outputs.tag }}

            Download **Mangapill-${{ steps.version.outputs.tag }}.apk** below and install it over your existing app to update.
            All releases are signed with the same key, so your library and history are kept.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
