name: Daily Scraper Health Check

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Check Scrapers & Sources Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Live requests to the real sites (the other unit tests are offline and cannot notice a site
      # moving). A failure here mails the repository owner; the job summary says which source broke.
      - name: Check every default source
        env:
          LIVE_HEALTH: '1'
        run: ./gradlew testDebugUnitTest --tests '*LiveHealthTest*' --stacktrace
